server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: rpenduser
  jackson:
    default-property-inclusion: non_null
  datasource:
    url: ${DB_URL:}
    username: ${DB_USERNAME:}
    password: ${DB_PASSWORD:}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate.jdbc.time_zone: UTC
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

rp:
  stage: ${RP_STAGE:prod}
  internal:
    api-key: ${INTERNAL_API_KEY:}
  supportgroup:
    # M5 re-vet consumer: rpsupportgroup's internal base URL (east-west), used to forward client-reported drift[].
    # Reuses rp.internal.api-key as the shared X-Internal-Api-Key. Blank ⇒ forwarding fails best-effort (no report impact).
    base-url: ${RP_SUPPORTGROUP_BASE_URL:}
  client:
    # M5.3c: the latest released desktop-client version; set per stage via the IaC (rpdeploy). Blank ⇒ never flag
    # an outdated client. A heartbeat whose reported appVersion is older than this gets updateAvailable=true.
    latest-version: ${RP_CLIENT_LATEST_VERSION:}

logging:
  level:
    root: ${LOG_LEVEL:WARN}
    com.reelypops: ${LOG_LEVEL:INFO}
